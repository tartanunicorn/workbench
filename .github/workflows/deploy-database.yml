# Applies new migrations to production when they reach main. Only migrations production doesn't have yet run.
name: Deploy database

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate production
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: What production has, and what's new
        run: supabase migration list
      - name: Apply new migrations
        # --include-all also applies a migration older than production's latest that was never applied
        run: supabase db push --include-all
