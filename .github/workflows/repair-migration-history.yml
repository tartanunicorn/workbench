# One-time: production's migration history was written by hand with different version numbers.
# This rewrites it to match the files in supabase/migrations. It changes only the history table, not the schema.
# 003 (harden_functions) and 010 onwards were never applied, so they stay pending for the deploy workflow.
name: Repair migration history

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "repair" to rewrite production's migration history
        required: true

jobs:
  repair:
    if: inputs.confirm == 'repair'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Forget the hand-written versions
        run: supabase migration repair --status reverted 20261029184046 20261029184047 20261029185230 20261029193226 20261029193737 20261029194422 20261029194704 20261029201229
      - name: Record the files that are already applied
        run: supabase migration repair --status applied 20261029000001 20261029000002 20261029000004 20261029000005 20261029000006 20261029000007 20261029000008 20261029000009
      - run: supabase migration list
