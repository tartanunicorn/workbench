<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<title>Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
/* Layout: an ops console. Sticky top bar with run dates, tabbed views, dense tables, a detail drawer on the right. */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#18212e; --muted:#5d6878; --line:#dde1e8; --soft:#eceff4;
  --accent:#1d5c8f; --accent-ink:#ffffff; --accent-soft:#e3edf6;
  --ok:#1f7a4d; --ok-soft:#e2f2e9; --warn:#a15c00; --warn-soft:#fbefdc; --bad:#b4232c; --bad-soft:#fbe4e5; --info:#5b4bb5; --info-soft:#ebe8f8;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --panel:#18202a; --ink:#e4e9f0; --muted:#97a3b3; --line:#2a3542; --soft:#1f2934;
  --accent:#6aa9dc; --accent-ink:#0d1620; --accent-soft:#1c3247;
  --ok:#5cc28c; --ok-soft:#173326; --warn:#e3a54a; --warn-soft:#3a2b14; --bad:#f07a80; --bad-soft:#3d1d21; --info:#a99cf0; --info-soft:#29254a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --panel:#18202a; --ink:#e4e9f0; --muted:#97a3b3; --line:#2a3542; --soft:#1f2934;
  --accent:#6aa9dc; --accent-ink:#0d1620; --accent-soft:#1c3247;
  --ok:#5cc28c; --ok-soft:#173326; --warn:#e3a54a; --warn-soft:#3a2b14; --bad:#f07a80; --bad-soft:#3d1d21; --info:#a99cf0; --info-soft:#29254a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.dates{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dates b{color:var(--ink);font-weight:600}
.runpick select{font:inherit;font-size:13px;font-weight:600;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs a{padding:9px 12px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
nav.tabs .count{font-family:var(--f-mono);font-size:11px;margin-left:5px;padding:1px 5px;border-radius:8px;background:var(--bad-soft);color:var(--bad)}
main{padding-block:18px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
h2{font-size:17px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--f-body)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.two{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.funnel{display:grid;grid-template-columns:minmax(120px,170px) 1fr 44px;gap:6px 10px;align-items:center;font-size:13px}
.funnel .track{height:16px;background:var(--soft);border-radius:3px;position:relative;overflow:hidden}
.funnel .fill{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.funnel .fill.warp{background:var(--info);opacity:.85}
.funnel .n{font-family:var(--f-mono);font-size:12px;text-align:right}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.timeline{position:relative;height:56px;margin:4px 8px 0}
.timeline .axis{position:absolute;left:0;right:0;top:22px;height:2px;background:var(--line)}
.timeline .m{position:absolute;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);white-space:nowrap}
.timeline .m .dot{width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--muted);margin-bottom:6px}
.timeline .m.key .dot{border-color:var(--accent);background:var(--accent)}
.timeline .m.key{color:var(--ink);font-weight:600}
.timeline .now{position:absolute;top:0;bottom:12px;width:2px;background:var(--bad)}
.timeline .now span{position:absolute;top:-2px;left:5px;font-size:11px;color:var(--bad);font-weight:600;white-space:nowrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--soft);position:sticky;top:0;cursor:pointer;user-select:none}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td.mono{font-family:var(--f-mono);font-size:12px}
tbody tr[data-id]{cursor:pointer}
tbody tr[data-id]:hover{background:var(--soft)}
a.jump{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px dotted currentColor}
a.jump:hover{border-bottom-style:solid}
tbody tr.sel{background:var(--accent-soft)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;letter-spacing:.02em;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-bad{background:var(--bad-soft);color:var(--bad)} .c-info{background:var(--info-soft);color:var(--info)} .c-mut{background:var(--soft);color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input,.filters select,.drawer select,.drawer input,.drawer textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-width:0}
.filters input[type=search]{width:220px;max-width:100%}
.muted{color:var(--muted)} .small{font-size:12px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.layout.open{grid-template-columns:minmax(0,1fr) 380px}
@media (max-width:1000px){.layout.open{grid-template-columns:minmax(0,1fr)}}
.drawer{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:120px;max-height:calc(100vh - 140px);overflow:auto}
.drawer select,.drawer input{width:100%}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.reasons{margin:0;padding-left:18px;font-size:13px}
.ev{font-size:12px;border-left:2px solid var(--line);padding:2px 0 2px 10px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;background:var(--panel);display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.hover{border-color:var(--accent);background:var(--accent-soft)}
.note{font-size:12px;color:var(--muted);max-width:70ch}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;z-index:20}
.sev-row{display:flex;gap:6px;flex-wrap:wrap}
.check-list li{margin-bottom:4px}
.more{display:flex;justify-content:center;padding:10px}

/* App shell: header on top, the view fills the rest; list views scroll inside their tables */
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;overflow:hidden}
header.top{position:relative;top:auto;flex:none}
main{flex:1;min-height:0;overflow:auto}
main.fill{overflow:hidden;display:flex;flex-direction:column;padding-block:14px}
main.fill>.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
main.fill .view>.tbl-wrap,main.fill .stack>.tbl-wrap{flex:1;min-height:0;overflow:auto}
main.fill .layout{flex:1;min-height:0}
main.fill .layout>.view{min-height:0;height:100%;display:flex;flex-direction:column;gap:12px}
main.fill .drawer{position:static;max-height:100%;height:100%}
main.fill .split{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
main.fill .split>.stack,main.fill .cols>.stack{display:flex;flex-direction:column;gap:8px;min-height:0}
main.fill .cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
@media (max-width:1000px){main.fill .layout.open>.view{display:none} main.fill .layout.open{grid-template-rows:minmax(0,1fr)} main.fill .cols{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,2fr) minmax(0,1fr)}}
.note{margin:0}
.tstatus{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink)}
.tlink{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}.tlink:hover{color:var(--accent)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;flex-direction:column;gap:1px;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.steps li.done span:first-of-type{color:var(--muted);text-decoration:line-through}
.steps label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer;text-align:left}
.drawer .steps input[type=checkbox]{width:auto;flex:none;margin:2px 0 0;padding:0}
.steps .late{color:var(--bad);font-weight:600}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.subtab{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:7px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
.subtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.dtable td.ed{cursor:text;min-width:60px}
.dtable td.ed:hover{background:var(--accent-soft)}
.dtable td.ro{cursor:default;color:var(--muted)}
.dtable td.ro:hover{background:none}
.dtable td.broken{color:var(--bad);font-weight:600;background:var(--bad-soft)}
.dtable tr.rowbad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.dtable tr.rowwarn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.dtable tr.flash{background:var(--warn-soft)}
.dtable td:has(.cell-ed){padding:2px 4px}
.cell-ed{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--accent);border-radius:4px;background:var(--panel);color:var(--ink);width:100%;min-width:140px}
th .fk{font-weight:400;text-transform:none;letter-spacing:0;color:var(--accent)}
td.wrapcell{white-space:normal;min-width:280px;max-width:420px}
.tbl-wrap{max-width:100%;min-width:0}
main.fill>.view{min-width:0}
@media (prefers-reduced-motion:no-preference){.funnel .fill{transition:width .4s ease}}
</style>

<header class="top">
  <div class="wrap bar">
    <div class="brand">Workbench <small id="srcName">Filing run</small></div>
    <div class="dates" id="dates"></div>
    <div class="actions">
      <span class="muted small" id="who"></span>
      <button id="reloadBtn" title="Reload everything from the database">Reload</button>
      <input type="file" id="fileIn" accept=".xlsx,.xls" hidden>
      <button id="saveBtn" class="primary" title="Saves your changed and new rows to the database">Save</button>
      <button id="outBtn" hidden>Sign out</button>
    </div>
  </div>
  <nav class="wrap tabs" id="tabs">
    <a href="#run">Run</a><a href="#returns">Returns</a><a href="#customers">Customers</a><a href="#owners">Owners</a><a href="#tasks">Tasks</a><a href="#issues">Issues</a><a href="#data">Data<span class="count" id="errCount" hidden></span></a>
  </nav>
</header>
<main class="wrap" id="main"><div class="drop" id="drop"><b>Loading…</b></div></main>
<div class="toast" id="toast" hidden></div>


<script>
"use strict";
/* ---------- state ---------- */
const SHEETS = ["Settings","Runs","Owners","Ownerships","Countries","Regions","ReturnTypes","ReturnTypeRules","Customers","Registrations","Returns","ReturnEvents","Issues","IssueLinks","BalancesNotices","Tasks","TaskRelations","Holidays"];
const STAGES = ["1 Not started","2 Data synced","3 Generated","4 In review","5 Ready to release","6 Released","7 Customer approved","8 Submitted","9 Confirmed / paid"];
const STATES = ["Open","Blocked","On hold","Done","Not required"];
let DB = null, C = null, fileName = "sphere_filing_db.xlsx";
const ui = {q:"", flag:"", owner:"", place:"", stage:"", stageLt:"", state:"", kind:"", tier:"", customer:"", issue:"", prepay:"", unowned:"", task:"", sort:"flagRank", dir:1, limit:1500, sel:null};

/* ---------- dates ---------- */
const DAY = 864e5;
function toDate(v){ if(v==null||v==="") return null; if(v instanceof Date) return new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())); if(typeof v==="number"){ const d=XLSX.SSF.parse_date_code(v); return new Date(Date.UTC(d.y,d.m-1,d.d)); } const d=new Date(v); return isNaN(d)?null:new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); }
const iso = d => d ? d.toISOString().slice(0,10) : "";
const fmt = d => d ? d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}) : "";
const fmtShort = d => d ? d.toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"UTC"}) : "";
const ymd = (y,m,d) => new Date(Date.UTC(y,m,d));
function isBiz(d, hol){ const w=d.getUTCDay(); return w!==0 && w!==6 && !hol.has(iso(d)); }
function nthBizDay(monthStart, n, hol){ let d=new Date(monthStart), c=0; while(true){ if(isBiz(d,hol)){ c++; if(c===n) return d; } d=new Date(+d+DAY); } }
function bizBetween(a, b, hol){ let n=0; for(let d=new Date(a); d<=b; d=new Date(+d+DAY)) if(isBiz(d,hol)) n++; return n; }

/* ---------- load ---------- */
function readWorkbook(buf){
  const wb = XLSX.read(buf,{type:"array",cellDates:true});
  const db = {};
  for(const s of SHEETS){
    const ws = wb.Sheets[s];
    db[s] = ws ? XLSX.utils.sheet_to_json(ws,{defval:null,raw:true}) : [];
    db[s].forEach((r,i)=>{ Object.defineProperty(r,"_row",{value:i+2,enumerable:false,writable:true}); for(const k in r){ if(typeof r[k]==="string"){ r[k]=r[k].trim(); if(r[k]==="") r[k]=null; } } });
  }
  db._missing = SHEETS.filter(s=>!wb.Sheets[s]);
  return db;
}
async function loadSample(){
  try{ const bin = atob(document.getElementById("sampleDb").textContent.trim()); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); DB = readWorkbook(u); fileName="sphere_filing_db.xlsx"; document.getElementById("srcName").textContent="sample workbook"; compute(); route(); }
  catch(e){ console.error(e); document.getElementById("main").innerHTML = dropHTML("Drop the Sphere filing workbook (.xlsx) here, or use Load workbook."); bindDrop(); }
}
function dropHTML(msg){ return `<div class="drop" id="drop"><b>${msg}</b><span class="note">The workbook is the database: one sheet per list, field names in row 1, one record per row.</span><label class="btn" for="fileIn">Choose file</label></div>`; }
function loadFile(f){ const fr=new FileReader(); fr.onload=()=>{ try{ DB=readWorkbook(new Uint8Array(fr.result)); fileName=f.name; document.getElementById("srcName").textContent=f.name; compute(); route(); toast(`Loaded ${f.name}`); }catch(e){ toast("That file could not be read as a workbook. Check it is .xlsx."); } }; fr.readAsArrayBuffer(f); }
function bindDrop(){ const el=document.body; el.addEventListener("dragover",e=>{e.preventDefault(); document.getElementById("drop")?.classList.add("hover");}); el.addEventListener("dragleave",()=>document.getElementById("drop")?.classList.remove("hover")); el.addEventListener("drop",e=>{e.preventDefault(); if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);}); }

/* ---------- compute ---------- */
function idx(rows,key){ const m=new Map(); rows.forEach(r=>{ if(r[key]!=null) m.set(String(r[key]),r); }); return m; }
function compute(){
  const S = Object.fromEntries(DB.Settings.map(r=>[r.key,r.value]));
  const hol = new Set(DB.Holidays.map(h=>iso(toDate(h.date))).filter(Boolean));
  const asOf = toDate(S.as_of_date) || toDate(new Date());
  const runs = idx(DB.Runs,"run_id");
  const run = runs.get(String(ui.run||"")) || runs.get(String(S.current_run)) || DB.Runs.find(r=>r.status==="Open") || DB.Runs[0];
  const rm = toDate(run.run_month);
  const relDay = +S.release_business_day||5, subDay = +S.submit_calendar_day||19, buffer = +S.submit_buffer_days||0;
  const bd = n => nthBizDay(rm,n,hol);
  const dates = {asOf, rm, BD1:bd(1), BD5:bd(relDay), CD19:ymd(rm.getUTCFullYear(),rm.getUTCMonth(),subDay)};
  dates.target = new Date(+dates.CD19 - buffer*DAY);
  dates.CD8 = ymd(rm.getUTCFullYear(),rm.getUTCMonth(),8); dates.CD12 = ymd(rm.getUTCFullYear(),rm.getUTCMonth(),12);
  dates.expStage = Math.min(6, 1 + (asOf>rm ? bizBetween(rm, new Date(+asOf-DAY), hol) : 0));
  const owners = idx(DB.Owners,"owner_id"), customers = idx(DB.Customers,"customer_id"), regs = idx(DB.Registrations,"registration_id");
  const countries = idx(DB.Countries,"country_code"), regions = idx(DB.Regions,"region_code"), issues = idx(DB.Issues,"issue_id"), types = idx(DB.ReturnTypes,"return_type_id");
  const openIssue = i => i && !["Resolved","Won't fix"].includes(i.status);
  // ownership lookup: target -> role -> active row (latest from_date)
  const own = new Map();
  for(const o of DB.Ownerships){
    const f=toDate(o.from_date), t=toDate(o.to_date);
    if((f && f>asOf) || (t && t<asOf)) continue;
    const tgt = o.return_id ? "R:"+o.return_id : o.run_id ? "U:"+o.run_id : o.issue_id ? "I:"+o.issue_id : o.task_id ? "T:"+o.task_id : null;
    if(!tgt) continue;
    if(!own.has(tgt)) own.set(tgt,{});
    const cur = own.get(tgt)[o.role];
    if(!cur || (toDate(cur.from_date)||0) <= (f||0)) own.get(tgt)[o.role] = o;
  }
  const ownerOf = (tgt,role) => own.get(tgt)?.[role]?.owner_id || "";
  const linksByReturn = new Map(), linksByIssue = new Map();
  for(const l of DB.IssueLinks){ if(l.return_id){ (linksByReturn.get(l.return_id)||linksByReturn.set(l.return_id,[]).get(l.return_id)).push(l); } (linksByIssue.get(l.issue_id)||linksByIssue.set(l.issue_id,[]).get(l.issue_id)).push(l); }
  const evByReturn = new Map(); for(const e of DB.ReturnEvents){ (evByReturn.get(e.return_id)||evByReturn.set(e.return_id,[]).get(e.return_id)).push(e); }
  // the task graph: Subtask of gives each task its parent; a Return header task carries the return_id
  const tasksById = new Map(DB.Tasks.map(t=>[String(t.task_id),t])), parentOf = new Map(), blockedBy = new Map(), blocks = new Map();

// Sheet name in the app ↔ table in Postgres, in an order that keeps foreign keys happy on save.
const TABLES = [["Settings","settings","key"],["Owners","owners","owner_id"],["Countries","countries","country_code"],["Regions","regions","region_code"],
  ["Customers","customers","customer_id"],["Runs","runs","run_id"],["ReturnTypes","return_types","return_type_id"],["ReturnTypeRules","return_type_rules","rule_id"],
  ["Registrations","registrations","registration_id"],["Returns","returns","return_id"],["ReturnEvents","return_events","event_id"],["Issues","issues","issue_id"],
  ["IssueLinks","issue_links","link_id"],["BalancesNotices","balances_notices","notice_id"],["Tasks","tasks","task_id"],["TaskRelations","task_relations","relation_id"],
  ["Ownerships","ownerships","ownership_id"],["Holidays","holidays","date,calendar"]];
const IDENTITY = new Set(["link_id","ownership_id"]);           // ids Postgres assigns
const BOOLS = new Set(["active","is_union","internal_review","systemic_fix"]);  // Yes/No in the app
const STAMPS = new Set(["created_at","updated_at","deleted_at"]);
const DATE_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
const sb = window.supabase.createClient(window.WORKBENCH.supabaseUrl, window.WORKBENCH.supabaseKey, { db: { schema: window.WORKBENCH.schema || "public" } });
const SNAP = {};
const p2 = n => String(n).padStart(2,"0");
function toDb(k, v){
  if(v === undefined) return null;
  if(BOOLS.has(k)) return v == null ? null : (v === true || v === "Yes");
  if(v instanceof Date) return (v.getHours()||v.getMinutes()) ? v.toISOString() : `${v.getFullYear()}-${p2(v.getMonth()+1)}-${p2(v.getDate())}`;
  return v;
}
function fromDb(k, v){
  if(BOOLS.has(k)) return v == null ? null : (v ? "Yes" : "No");
  if(typeof v === "string"){ v = v.trim(); if(v === "") return null; const m = DATE_RE.exec(v); if(m) return new Date(+m[1], +m[2]-1, +m[3]); }
  return v;
}
const rowKey = (pk, r) => pk.split(",").map(k => String(toDb(k, r[k]))).join("|");
const rowJson = r => JSON.stringify(Object.keys(r).filter(k => !STAMPS.has(k)).sort().map(k => [k, toDb(k, r[k])]));
async function fetchAll(table){
  const out = []; const page = 1000;
  for(let from = 0; ; from += page){
    const { data, error } = await sb.from(table).select("*").is("deleted_at", null).order(TABLES.find(t=>t[1]===table)[2].split(",")[0]).range(from, from + page - 1);
    if(error) throw error; out.push(...data); if(data.length < page) return out;
  }
}
async function loadDb(){
  document.getElementById("main").innerHTML = `<div class="drop"><b>Loading…</b></div>`;
  try{
    const all = await Promise.all(TABLES.map(([, t]) => fetchAll(t)));
    const db = {};
    TABLES.forEach(([sheet, , pk], i) => {
      db[sheet] = all[i].map((r, j) => { const o = {}; for(const k in r){ if(!STAMPS.has(k)) o[k] = fromDb(k, r[k]); }
        Object.defineProperty(o, "_row", {value: j+2, enumerable: false, writable: true}); return o; });
      SNAP[sheet] = new Map(db[sheet].map(r => [rowKey(pk, r), rowJson(r)]));
    });
    db._missing = [];
    if(!db.Runs.length && !db.Owners.length){ emptyView(); return; }
    DB = db; changes = 0; document.getElementById("saveBtn").textContent = "Save";
    compute(); route();
  }catch(e){ document.getElementById("main").innerHTML = `<div class="drop"><b>Could not load the database.</b><span class="note">${esc(e.message||String(e))}</span></div>`; }
}
async function saveDb(){
  if(!DB) return;
  const btn = document.getElementById("saveBtn"); btn.disabled = true; btn.textContent = "Saving…";
  let n = 0;
  try{
    for(const [sheet, table, pk] of TABLES){
      const ups = [], ins = [], objs = [];
      // a parent region must exist before its children
      const rows = sheet === "Regions" ? (DB[sheet]||[]).slice().sort((a, b) => (a.parent_region ? 1 : 0) - (b.parent_region ? 1 : 0)) : (DB[sheet]||[]);
      for(const r of rows){
        const isNew = pk.split(",").some(k => IDENTITY.has(k) && r[k] == null);
        if(!isNew && SNAP[sheet].get(rowKey(pk, r)) === rowJson(r)) continue;
        const o = {}; for(const k in r){ if(!STAMPS.has(k) && !(IDENTITY.has(k) && r[k] == null)) o[k] = toDb(k, r[k]); }
        (isNew ? ins : ups).push(o); if(isNew) objs.push(r);
      }
      for(let i = 0; i < ups.length; i += 500){ const { error } = await sb.from(table).upsert(ups.slice(i, i+500), { onConflict: pk }); if(error) throw new Error(`${table}: ${error.message}`); }
      for(let i = 0; i < ins.length; i += 500){ const { data, error } = await sb.from(table).insert(ins.slice(i, i+500)).select(pk); if(error) throw new Error(`${table}: ${error.message}`);
        data.forEach((d, j) => { objs[i+j][pk] = d[pk]; }); }
      n += ups.length + ins.length;
      SNAP[sheet] = new Map(DB[sheet].map(r => [rowKey(pk, r), rowJson(r)]));
    }
    changes = 0; btn.textContent = "Save"; toast(n ? `Saved ${n} rows` : "Nothing to save");
  }catch(e){ btn.textContent = `Save (${changes})`; toast("Save failed: " + (e.message||e)); }
  btn.disabled = false;
}
// an empty database: load a workbook (same layout as the prototype) and save it in
function emptyView(){
  document.getElementById("main").innerHTML = `<div class="drop" id="drop"><b>The database is empty.</b>
    <span class="note">Load a workbook with one sheet per list and field names in row 1 (data/sample_db.xlsx in the repo), check it, then press Save to write it in.</span>
    <label class="btn" for="fileIn">Choose workbook</label></div>`;
}
document.getElementById("fileIn").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  const fr = new FileReader(); fr.onload = () => { try{ DB = readWorkbook(new Uint8Array(fr.result)); for(const [sheet] of TABLES) SNAP[sheet] = new Map();
      changes = TABLES.reduce((n, [sheet]) => n + (DB[sheet]||[]).length, 0); document.getElementById("saveBtn").textContent = `Save (${changes})`;
      compute(); route(); toast(`Loaded ${f.name}. Press Save to write ${changes} rows.`); }
    catch(err){ toast("That file could not be read as a workbook."); } }; fr.readAsArrayBuffer(f); });
// sign in with a one-time email link; the database only answers signed-in people
function signInView(msg){
  document.getElementById("main").innerHTML = `<div class="drop"><b>Sign in to Workbench</b>
    <form id="signin" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><input type="email" id="email" required placeholder="you@company.com" style="font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;min-width:0"><button class="primary">Email me a sign-in link</button></form>
    <span class="note" id="signmsg">${esc(msg||"")}</span></div>`;
  document.getElementById("signin").addEventListener("submit", async e => { e.preventDefault();
    const { error } = await sb.auth.signInWithOtp({ email: document.getElementById("email").value, options: { emailRedirectTo: location.origin + location.pathname } });
    document.getElementById("signmsg").textContent = error ? error.message : "Check your email for the sign-in link."; });
}
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ signInView(); return; }
  document.getElementById("who").textContent = session.user.email; document.getElementById("outBtn").hidden = false;
  loadDb();
}
sb.auth.onAuthStateChange((ev) => { if(ev === "SIGNED_IN" && !DB) boot(); if(ev === "SIGNED_OUT"){ DB = null; signInView("Signed out."); } });
document.getElementById("saveBtn").addEventListener("click", saveDb);
document.getElementById("outBtn").addEventListener("click", () => sb.auth.signOut());
document.getElementById("reloadBtn").addEventListener("click", () => { const b = document.getElementById("reloadBtn");
  if(changes && b.dataset.armed !== "1"){ b.dataset.armed = "1"; b.textContent = "Discard edits and reload?"; setTimeout(() => { b.dataset.armed = ""; b.textContent = "Reload"; }, 4000); return; }
  b.dataset.armed = ""; b.textContent = "Reload"; loadDb(); });
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,3200); }
window.ui=ui; window.route=route;
boot();
</script>
